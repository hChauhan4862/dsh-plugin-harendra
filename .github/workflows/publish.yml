name: Publish to npm

# Publishes on a version tag, e.g.
#   git tag v3.0.1 && git push origin v3.0.1
# workflow_dispatch lets a maintainer re-run a release from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate the package
        run: |
          node --check client.js
          node --check index.js
          node -e "for (const f of ['package.json','locale/en.json','locale/zh.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          echo "package validates"

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "tag=$tag package.json=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump one of them."
            exit 1
          fi

      - name: Require an npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::No NPM_TOKEN secret is set. Create an npm automation token and add it as the repository secret NPM_TOKEN (Settings -> Secrets and variables -> Actions), then re-run this workflow."
            exit 1
          fi

      - name: Publish
        id: publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance 2>&1 | tee publish.log

      # npm's own refusal is the useful part of a failure, so it is surfaced in the
      # run summary and annotated with the usual causes instead of a bare exit code.
      - name: Explain a failed publish
        if: steps.publish.outcome == 'failure'
        run: |
          detail="$(grep -v '^$' publish.log 2>/dev/null | tail -3 | tr '\n' ' ' | cut -c1-400)"
          {
            echo "### npm publish failed"
            echo '```'
            tail -40 publish.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::npm refused the publish. npm said: ${detail} -- Usual causes: (1) a stage-only token cannot publish directly, so use a classic Automation token or granular with 'Read and write (publish and stage)'; (2) a token scoped to specific packages cannot cover a package that does not exist yet, so choose 'All packages' for the first release; (3) the token lacks 2FA bypass, or has expired. Trusted publishing (OIDC) avoids tokens entirely once the package exists."
          exit 1

      - name: Confirm the published version
        if: steps.publish.outcome == 'success'
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "Published dsh-plugin-harendra@$version" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/dsh-plugin-harendra" >> "$GITHUB_STEP_SUMMARY"
